- hosts: localhost  # Or your target hosts
  become: true  # If you need root privileges for certain steps (e.g., installing system dependencies)
  remote_user: mond
  vars:
    neovim_version: v0.10.3  # Or the desired version
    neovim_install_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/personal/neovim" # Where to install Neovim
    # System dependencies (adjust for your OS)
    system_deps:
      - cmake
      - git
      - gettext # For some plugins/features
      - libtool # For some plugins/features
      - unzip # For extracting some dependencies
      - ninja
      # - python3-dev # If you want Python support
      - nodejs # If you want Node.js support
      - npm # Node.js package manager
      - luarocks # For Lua dependencies (important for many Neovim setups)
  tasks:
    - name: Install system dependencies (adjust for your OS)
      package:
        name: "{{ item }}"
        state: present
      loop: "{{ system_deps }}"
      become: false

    - name: Create Neovim install directory
      file:
        path: "{{ neovim_install_dir }}"
        state: directory
        mode: 0755
      become: true

    - name: Clone Neovim repository
      git:
        repo: https://github.com/neovim/neovim.git
        dest: "{{ neovim_install_dir }}/neovim"
        version: "{{ neovim_version }}"
        update: yes  # Update if the directory exists
        force: yes  # Force update if needed
      become: false  # Git operations usually don't need root

    - name: Create build directory
      file:
        path: "{{ neovim_install_dir }}/build"
        state: directory
        mode: 0755
      become: false

    - name: Configure Neovim build
      command: cmake -DCMAKE_INSTALL_PREFIX={{ neovim_install_dir }} -DCMAKE_BUILD_TYPE=Release ../neovim
      args:
        chdir: "{{ neovim_install_dir }}/build"
      become: false

    - name: Build Neovim
      command: make -j$(nproc)  # Use all cores for faster build
      args:
        chdir: "{{ neovim_install_dir }}/build"
      become: false

    - name: Install Neovim
      command: make install
      args:
        chdir: "{{ neovim_install_dir }}/build"
      become: true  # Installation usually requires root

    # Optional: Create a symbolic link for easier access
